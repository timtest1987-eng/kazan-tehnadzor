<script>
(function() {
  var wrk = 'https://telegram-chat.timtest1987.workers.dev';
  var vid = localStorage.getItem('ch_vid') || crypto.randomUUID();
  localStorage.setItem('ch_vid', vid);
  var b = document.getElementById('chatBtn');
  var w = document.getElementById('chatWidget');
  var c = document.getElementById('chatClose');
  var i = document.getElementById('chatInput');
  var s = document.getElementById('chatSend');
  var m = document.getElementById('chatMessages');
  var lt = parseInt(localStorage.getItem('ch_ts') || '0');
  var sending = 0;
  if (!b || !w) return;
  function tg() {
    w.classList.toggle('open');
    if (w.classList.contains('open')) { i.focus(); poll(); m.scrollTop = m.scrollHeight; }
  }
  b.addEventListener('click', tg);
  c.addEventListener('click', tg);
  function addMsg(nm, txt, cls) {
    var d = document.createElement('div');
    d.className = 'chat-msg ' + cls;
    if (nm) {
      var l = document.createElement('div');
      l.style.fontWeight = '700';
      l.style.marginBottom = '4px';
      l.textContent = nm;
      d.appendChild(l);
    }
    var p = document.createElement('div');
    p.textContent = txt;
    d.appendChild(p);
    m.appendChild(d);
    m.scrollTop = m.scrollHeight;
  }
  function poll() {
    fetch(wrk + '/api/messages?visitorId=' + encodeURIComponent(vid))
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (!d.messages) return;
        for (var i = 0; i < d.messages.length; i++) {
          var g = d.messages[i];
          if (g.ts <= lt) continue;
          lt = g.ts;
          if (g.role === 'operator') {
            addMsg(g.name || 'Скрепыч', '→ ' + g.message, 'bot');
          }
        }
        localStorage.setItem('ch_ts', lt);
      })
      .catch(function() {});
  }
  function send() {
    if (sending || !i.value.trim()) return;
    var t = i.value.trim();
    sending = 1;
    s.disabled = true;
    addMsg(null, t, 'user');
    i.value = '';
    fetch(wrk + '/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ visitorId: vid, message: t })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d && d.ok) {
        addMsg(null, '\u2705 \u041E\u0442\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u043E!', 'bot');
        poll();
      } else {
        addMsg(null, '\u274C \u041E\u0448\u0438\u0431\u043A\u0430. \u041F\u043E\u043F\u0440\u043E\u0431\u0443\u0439\u0442\u0435 \u043F\u043E\u0437\u0436\u0435.', 'bot');
      }
    })
    .catch(function() {
      addMsg(null, '\u274C \u041E\u0448\u0438\u0431\u043A\u0430 \u0441\u0435\u0440\u0432\u0435\u0440\u0430. \u041F\u043E\u043F\u0440\u043E\u0431\u0443\u0439\u0442\u0435 \u043F\u043E\u0437\u0436\u0435.', 'bot');
    })
    .then(function() {
      sending = 0;
      s.disabled = false;
      i.focus();
    });
  }
  s.addEventListener('click', send);
  i.addEventListener('keydown', function(e) { if (e.key === 'Enter') send(); });
  setInterval(poll, 3000);
  setTimeout(poll, 1000);
})();
</script>
